<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração | ede_3d</title> 

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      background: #181818;
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #ff6a00;
    }

    header img {
      width: 130px;
      max-width: 40%;
    }

    header h1 {
      color: #ff6a00;
      margin-bottom: 5px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: #1d1d1d;
      border-radius: 15px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #292929;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      background: #ff6a00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }

    .voltar {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #ff8a35;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <img src="logo-ede3d.png" alt="ede_3d">
  <h1>Área Administrativa</h1>
  <p>Cadastro de produtos</p>
</header>

<div class="container">

  <form id="produtoForm">

    <label for="nome">Nome do produto</label>
    <input id="nome" type="text" required>

    <label for="preco">Preço</label>
    <input id="preco" type="number" step="0.01" min="0" required>

    <label for="categoria">Categoria</label>
    <select id="categoria" required>
      <option value="">Selecione</option>
      <option value="cozinha">Cozinha</option>
      <option value="banheiro">Banheiro</option>
      <option value="sala">Sala</option>
      <option value="quarto">Quarto</option>
      <option value="brinquedos">Brinquedos</option>
      <option value="chaveiros">Chaveiros</option>
      <option value="miniaturas">Miniaturas</option>
      <option value="natal">Natal</option>
      <option value="halloween">Halloween</option>
      <option value="aniversarios">Aniversários</option>
      <option value="utilitarios">Utilitários</option>
    </select>

    <label for="descricao">Descrição</label>
    <textarea id="descricao" required></textarea>

    <label for="foto">Foto do produto</label>
    <input id="foto" type="file" accept="image/*" required>

    <label for="disponivel">Disponibilidade</label>
    <select id="disponivel">
      <option value="true">Disponível</option>
      <option value="false">Indisponível</option>
    </select>

    <button id="salvar" type="submit">Cadastrar produto</button>

    <div id="mensagem"></div>

  </form>

  <a class="voltar" href="index.html">← Voltar para o site</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xdceqwwpvmjqowjunqvt.supabase.co";
const SUPABASE_KEY = "sb_publishable_aw2xm8AIgS_5WyXCZAkXyg_OBiy2yCS";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("produtoForm");
const mensagem = document.getElementById("mensagem");
const botao = document.getElementById("salvar");

form.addEventListener("submit", async (event) => {

  event.preventDefault();

  mensagem.textContent = "Cadastrando produto...";
  botao.disabled = true;

  try {

    const arquivo = document.getElementById("foto").files[0];

    if (!arquivo) {
      throw new Error("Escolha uma foto.");
    }

    const extensao = arquivo.name.split(".").pop();
    const nomeArquivo =
      Date.now() + "-" +
      Math.random().toString(36).substring(2) +
      "." + extensao;

    const { error: uploadError } =
      await supabaseClient.storage
        .from("produtos")
        .upload(nomeArquivo, arquivo);

    if (uploadError) throw uploadError;

    const { data: imagemData } =
      supabaseClient.storage
        .from("produtos")
        .getPublicUrl(nomeArquivo);

    const produto = {
      nome: document.getElementById("nome").value.trim(),
      preco: Number(document.getElementById("preco").value),
      categoria: document.getElementById("categoria").value,
      descricao: document.getElementById("descricao").value.trim(),
      foto: imagemData.publicUrl,
      disponivel: document.getElementById("disponivel").value === "true"
    };

    const { error: produtoError } =
      await supabaseClient
        .from("produtos")
        .insert([produto]);

    if (produtoError) throw produtoError;

    mensagem.style.color = "#4cff88";
    mensagem.textContent = "Produto cadastrado com sucesso!";

    form.reset();

  } catch (erro) {

    console.error(erro);

    mensagem.style.color = "#ff6767";
    mensagem.textContent =
      "Erro: " + (erro.message || "não foi possível cadastrar.");

  } finally {

    botao.disabled = false;

  }
});
</script>

</body>
</html>
